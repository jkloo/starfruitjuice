name: Check Webpage

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:
  check-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run checker
        run: poetry run check
